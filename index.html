.sub{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:15px;max-width:50%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip span{color:var(--muted)}
.status{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);background:var(--card);padding:6px 11px;border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.q{font-size:18px;font-weight:600;margin:0 0 12px}
.num{color:var(--muted);font-weight:500;margin-right:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--seg);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;padding:15px 0;border-radius:9px;
  transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.note p{margin:0 0 10px;color:var(--muted);font-size:15px}
.note input{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  -webkit-user-select:text;user-select:text}
.warnbox{border:1px solid var(--warn)}
.warnbox p{margin:0;font-size:15px}
footer{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(env(safe-area-inset-bottom) + 10px);
  background:linear-gradient(to top,var(--bg) 75%,transparent)}
#done{width:100%;border:0;border-radius:14px;padding:17px;font:inherit;font-size:19px;font-weight:700;background:var(--accent);color:var(--on-accent)}
#done:disabled{opacity:.35}
.sync{text-align:center;font-size:13px;color:var(--muted);margin-top:8px;min-height:1.3em}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 112px);background:var(--ink);color:var(--bg);
  border-radius:14px;padding:12px 10px 12px 16px;display:flex;justify-content:space-between;align-items:center;
  transform:translateY(16px);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast button{border:0;background:transparent;color:inherit;text-decoration:underline;font:inherit;font-weight:700;padding:6px 10px}
</style>
</head>
<body>
<header>
  <h1><span class="logo" role="img" aria-label="axolokl"></span><span class="sub">Bike survey</span></h1>
  <button class="chip" id="who" type="button">Set name</button>
</header>

<div class="status">
  <span class="pill"><i class="dot" id="gpsDot"></i><span id="gpsText">Locating…</span></span>
  <span class="pill" id="countText">0 bikes today</span>
</div>

<div class="card warnbox" id="cfgWarn" hidden>
  <p><b>Not connected to the Google Sheet yet.</b> Entries are kept safely on this phone and will upload once the script URL is added to index.html.</p>
</div>

<div class="card note" id="nameCard" hidden>
  <p>Your name — added to each entry so you know who logged it.</p>
  <input id="nameInput" placeholder="e.g. Bob" autocomplete="name" enterkeyhint="done">
</div>

<main id="qs"></main>

<footer>
  <button id="done" type="button" disabled>Done</button>
  <div class="sync" id="sync"></div>
</footer>

<div class="toast" id="toast" role="status"><span id="toastText">Saved ✓</span><button id="undo" type="button">Undo</button></div>

<script>
/* ================================================================
   1. PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BETWEEN THE QUOTES
      (it ends in /exec)
   ================================================================ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0_B9KvKSFDpK-K-J7XqlLkClNF6wbwKarypN6G1Bau6-i_5YCG8sF4HWsLwu5NwJJVg/exec";

/* 2. The questions. Keys must match QUESTION_COLUMNS in Code.gs. */
const QUESTIONS = [
  { key: "quickRelease", text: "Does the bike have quick-release axles?" },
  { key: "frontLocked",  text: "Is the front wheel locked?" },
  { key: "missingWheel", text: "Is the bike missing a wheel?" },
];

/* ---------------- no edits needed below this line ---------------- */
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const configured = /^https:\/\/script\.google\.com\/.+\/exec$/.test(SCRIPT_URL.trim());

let answers = {};
let queue = store.get("queue", []);          // pending uploads: {op:'add',record} | {op:'delete',id}
let collector = store.get("collector", "");
let fix = null, gpsErr = null, watchId = null;
let sending = false, lastError = "", sheetRows = null;
let inFlight = new Set();      // ops currently being uploaded
let batchOk = null;           // does the sheet script accept batches? (null = not known yet)
let lastSavedId = null, toastTimer = null;

/* ---------- questions ---------- */
function renderQuestions() {
  $("qs").innerHTML = QUESTIONS.map((q, i) => `
    <section class="card">
      <p class="q"><span class="num">${i + 1}</span>${esc(q.text)}</p>
      <div class="seg" role="group" aria-label="${esc(q.text)}">
        <button type="button" data-k="${q.key}" data-v="Yes" aria-pressed="false">Yes</button>
        <button type="button" data-k="${q.key}" data-v="No" aria-pressed="false">No</button>
      </div>
    </section>`).join("");
}
$("qs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]");
  if (!b) return;
  answers[b.dataset.k] = b.dataset.v;
  document.querySelectorAll(`button[data-k="${b.dataset.k}"]`)
    .forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  updateDone();
});
function updateDone() {
  const all = QUESTIONS.every((q) => answers[q.key]);
  const name = collector || $("nameInput").value.trim();
  $("done").disabled = !(all && name);
}

/* ---------- collector name ---------- */
function setCollector(v) {
  collector = v.trim();
  store.set("collector", collector);
  renderWho();
  updateDone();
}
function renderWho() {
  $("who").innerHTML = collector ? `<span>by</span> ${esc(collector)}` : "Set name";
  $("nameCard").hidden = !!collector;
}
$("nameInput").addEventListener("input", updateDone);
$("nameInput").addEventListener("change", (e) => { if (e.target.value.trim()) setCollector(e.target.value); });
$("nameInput").addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.blur(); });
$("who").addEventListener("click", () => {
  const v = prompt("Your name", collector);
  if (v !== null && v.trim()) setCollector(v);
});

/* ---------- daily count ---------- */
const todayKey = () => new Date().toDateString();
function bumpCount(delta) {
  const c = store.get("count", { day: "", n: 0 });
  if (c.day !== todayKey()) { c.day = todayKey(); c.n = 0; }
  c.n = Math.max(0, c.n + delta);
  store.set("count", c);
  renderCount();
}
function renderCount() {
  const c = store.get("count", { day: "", n: 0 });
  const n = c.day === todayKey() ? c.n : 0;
  $("countText").textContent = `${n} ${n === 1 ? "bike" : "bikes"} today`;
}

/* ---------- GPS ---------- */
const toFix = (p) => ({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), t: Date.now() });
function startGps() {
  if (!("geolocation" in navigator)) { gpsErr = "No GPS available"; renderGps(); return; }
  if (watchId !== null) return;
  watchId = navigator.geolocation.watchPosition(
    (p) => { fix = toFix(p); gpsErr = null; renderGps(); },
    (e) => { gpsErr = e.code === 1 ? "Location blocked" : "Searching for GPS…"; renderGps(); },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
  );
}
function stopGps() {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
}
function renderGps() {
  const dot = $("gpsDot"), t = $("gpsText");
  if (fix && Date.now() - fix.t < 60000) {
    dot.className = "dot " + (fix.acc <= 20 ? "ok" : fix.acc <= 60 ? "warn" : "bad");
    t.textContent = `GPS ±${fix.acc} m`;
  } else if (gpsErr) { dot.className = "dot bad"; t.textContent = gpsErr; }
  else { dot.className = "dot"; t.textContent = "Locating…"; }
}
function freshFix() {
  if (fix && Date.now() - fix.t < 30000) return Promise.resolve(fix);
  return new Promise((resolve) => {
    if (!("geolocation" in navigator)) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (p) => { fix = toFix(p); renderGps(); resolve(fix); },
      () => resolve(fix && Date.now() - fix.t < 120000 ? fix : null),
      { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 }
    );
  });
}

/* ---------- save ---------- */
$("done").addEventListener("click", async () => {
  const typed = $("nameInput").value.trim();
  if (!collector && typed) setCollector(typed);
  const btn = $("done");
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = "Getting location…";

  const f = await freshFix();
  const record = {
    id: uid(),
    savedAt: new Date().toISOString(),
    collector,
    answers: { ...answers },
    lat: f ? f.lat : null,
    lng: f ? f.lng : null,
    accuracy: f ? f.acc : null,
  };
  queue.push({ op: "add", record });
  store.set("queue", queue);
  bumpCount(1);

  answers = {};
  document.querySelectorAll("button[data-k]").forEach((x) => x.setAttribute("aria-pressed", "false"));
  btn.textContent = "Done";
  updateDone();
  window.scrollTo({ top: 0, behavior: "smooth" });
  if (navigator.vibrate) navigator.vibrate(30);
  showToast(f ? `Saved ✓  (±${f.acc} m)` : "Saved ✓  — no location", record.id);
  flush();
});

/* ---------- undo ---------- */
function showToast(text, id) {
  lastSavedId = id;
  $("toastText").textContent = text;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 6000);
}
function hideToast() { $("toast").classList.remove("show"); lastSavedId = null; }
$("undo").addEventListener("click", () => {
  const id = lastSavedId;
  if (!id) return;
  hideToast();
  const i = queue.findIndex((o) => o.op === "add" && o.record.id === id);
  if (i >= 0 && !inFlight.has(queue[i])) queue.splice(i, 1); // never uploaded: just drop it
  else queue.push({ op: "delete", id });                      // already (or being) uploaded: delete the row
  store.set("queue", queue);
  bumpCount(-1);
  flush();
});

/* ---------- upload ---------- */
async function send(op) {
  if (!navigator.onLine) return { ok: false, error: "offline" };
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), op.op === "batch" ? 60000 : 20000);
  try {
    // Plain-text body keeps this a "simple" request, which Apps Script accepts cross-origin.
    const r = await fetch(SCRIPT_URL.trim(), { method: "POST", body: JSON.stringify(op), signal: ctrl.signal });
    const j = await r.json();
    return j.ok ? { ok: true, rows: j.rows } : { ok: false, error: j.error || "Sheet error" };
  } catch (e) {
    return { ok: false, error: navigator.onLine ? "Can't reach the sheet" : "offline" };
  } finally {
    clearTimeout(timer);
  }
}
async function flush() {
  if (sending || !configured || !queue.length) { renderSync(); return; }
  sending = true; renderSync();
  try {
    while (queue.length) {
      // A backlog goes up in one request (up to 100 at a time); a single entry goes on its own.
      const useBatch = queue.length > 1 && batchOk !== false;
      const ops = useBatch ? queue.slice(0, 100) : [queue[0]];
      ops.forEach((o) => inFlight.add(o));
      const res = await send(useBatch ? { op: "batch", ops } : ops[0]);
      ops.forEach((o) => inFlight.delete(o));
      if (useBatch && !res.ok && /Unknown operation/.test(res.error || "")) { batchOk = false; continue; } // older script: go one by one
      if (!res.ok) { lastError = res.error; break; }
      if (useBatch) batchOk = true;
      lastError = "";
      if (res.rows != null) sheetRows = res.rows;
      ops.forEach((o) => { const j = queue.indexOf(o); if (j >= 0) queue.splice(j, 1); });
      store.set("queue", queue);
      renderSync();
    }
  } finally {
    sending = false; renderSync();
  }
}
async function ping() {
  if (!configured || queue.length) return;
  try {
    const r = await fetch(SCRIPT_URL.trim());
    const j = await r.json();
    if (j.ok) { sheetRows = j.rows; lastError = ""; }
  } catch (e) { lastError = navigator.onLine ? "Can't reach the sheet" : "offline"; }
  renderSync();
}
function renderSync() {
  const n = queue.length, s = $("sync");
  $("cfgWarn").hidden = configured;
  if (!configured) { s.textContent = n ? `${n} saved on this phone` : ""; return; }
  if (sending) s.textContent = n ? `Uploading… ${n} left` : "Uploading…";
  else if (!n && lastError) s.textContent = lastError === "offline" ? "Offline" : lastError;
  else if (!n) s.textContent = "All synced" + (sheetRows != null ? ` · ${sheetRows} in sheet` : "");
  else if (lastError === "offline") s.textContent = `Offline · ${n} waiting, will upload automatically`;
  else s.textContent = `${n} waiting · ${lastError || "will retry"}`;
}

/* ---------- lifecycle ---------- */
window.addEventListener("online", flush);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { startGps(); flush(); }
  else stopGps();   // saves battery while the app is in the background
});
setInterval(() => { if (queue.length) flush(); }, 20000);
setInterval(renderGps, 10000);

renderQuestions();
renderWho();
renderCount();
renderGps();
renderSync();
updateDone();
startGps();
flush().then(ping);
</script>
</body>
</html>
